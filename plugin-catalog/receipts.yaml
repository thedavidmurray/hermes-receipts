title: Receipts
description: "Thermal-paper evidence receipts for Hermes turns. Read-only historical state.db backfill plus a profile-local tool metadata ledger; claim matcher and optional Desktop pane. Disclosure: reads the selected profile's state.db conversations/tool arguments read-only; stores tool names, args hashes, coarse results and generated images under plugin-data/receipts. No network/model calls, telemetry, credentials or background work. Optional USB printer requires explicit device IDs and separately installed python-escpos; opt-in response stamp and completion-block gate are off by default. Detection benchmark: 200 hand-labelled historical answers, 83.87% precision / 55.32% recall at binary claim detection (not evidence-verdict accuracy)."
