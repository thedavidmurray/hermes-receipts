title: Receipts
description: "Thermal-paper evidence receipts for Hermes turns. Read-only historical state.db backfill plus a profile-local tool metadata ledger; deterministic claim matcher and optional Desktop pane. Disclosure: reads the selected profile's state.db conversations/tool arguments read-only; stores tool names, args hashes, coarse results and generated images under plugin-data/receipts. No network/model calls, telemetry, credentials or background work. Optional USB printer requires explicit device IDs and separately installed python-escpos; opt-in response stamp and prior-answer completion-block gate are off by default. Implementer-labelled benchmark: 200 historical answers, 87.04% precision / 50.00% recall at binary claim detection; 61/66 (92.42%) claim-level extraction precision. Critic spot-checked 30 answer labels (~28 agree); evidence-verdict accuracy not measured."
maintainer: thedavidmurray
